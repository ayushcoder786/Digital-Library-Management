################################################################################
# render.yaml — Digital Library Management – Backend Services
#
# Three services are deployed:
#   1. gateway        → FastAPI (Python)   – API Gateway on port 8000
#   2. taskservices   → Node.js (Express)  – MongoDB/NoSQL service
#   3. coreservices   → Spring Boot (Java) – PostgreSQL/SQL service
#
# Databases:
#   • PostgreSQL  → managed by Render (free tier)
#   • MongoDB     → external Atlas cluster (connection string in env var)
#
# IMPORTANT: All secret env vars (marked sync: false) must be set manually
# in the Render dashboard after the initial deploy.
################################################################################

services:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. API GATEWAY  (FastAPI / Python)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: digital-library-gateway
    runtime: python
    region: singapore          # closest free-tier region to India
    plan: free

    # Path inside your repo that contains requirements.txt and main.py
    rootDir: Backend/gateway

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # ── Upstream service URLs (set after the other two services are deployed) ──
      - key: SPRING_BOOT_URL
        value: https://digital-library-coreservices.onrender.com   # update after deploy

      - key: NODE_URL
        value: https://digital-library-taskservices.onrender.com   # update after deploy

      # ── JWT ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard — never commit secrets!

      - key: JWT_ALGORITHM
        value: HS256

      # ── CORS — add your frontend URL after it is deployed ──────────────────
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com   # update after frontend deploy

  # ──────────────────────────────────────────────────────────────────────────
  # 2. TASK SERVICES  (Node.js / Express / MongoDB)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: digital-library-taskservices
    runtime: node
    region: singapore
    plan: free

    rootDir: Backend/taskservices

    buildCommand: npm install
    startCommand: node main.js    # nodemon is dev-only; use node for production

    envVars:
      # ── MongoDB Atlas ───────────────────────────────────────────────────────
      - key: DBURL
        sync: false   # paste your full Atlas connection string in the dashboard

      # ── JWT (must match gateway & Spring Boot) ──────────────────────────────
      - key: SECRETE_KEY
        sync: false

      # Render injects PORT automatically; the app already reads process.env.PORT

  # ──────────────────────────────────────────────────────────────────────────
  # 3. CORE SERVICES  (Spring Boot / Maven / PostgreSQL)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: digital-library-coreservices
    runtime: java
    region: singapore
    plan: free

    rootDir: Backend/coreservices/coreservices

    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/coreservices-0.0.1-SNAPSHOT.jar

    envVars:
      # ── PostgreSQL (Render-managed database — see "databases" section below) ─
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: digital-library-postgres
          property: connectionString

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: digital-library-postgres
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: digital-library-postgres
          property: password

      # ── JPA DDL — use "update" on first deploy, then change to "validate" ───
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      - key: SPRING_JPA_SHOW_SQL
        value: "false"

      # ── JWT (must match gateway & Node service) ─────────────────────────────
      - key: JWT_SECRET
        sync: false

      # ── Server port (Render injects PORT; Spring reads SERVER_PORT) ──────────
      - key: SERVER_PORT
        value: "10000"   # Render's default; your app should also honour $PORT

# ──────────────────────────────────────────────────────────────────────────────
# MANAGED DATABASES
# ──────────────────────────────────────────────────────────────────────────────
databases:
  - name: digital-library-postgres
    databaseName: digital_library
    user: dlm_user
    region: singapore
    plan: free
