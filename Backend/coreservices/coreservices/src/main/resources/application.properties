spring.application.name=coreservices
server.port=8081

# ─── PostgreSQL DataSource ───────────────────────────────────────────────────
# Copy this file to application-local.properties and fill in your real values.
# application-local.properties is gitignored and will NOT be committed.
spring.datasource.url=jdbc:postgresql://localhost:5432/diglib
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
