spring.application.name=coreservices

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL DataSource ─────────────────────────────────────────────────────
# On Render: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD are injected
# from the managed database via render.yaml (fromDatabase property)
# For local dev: fallbacks point to local Postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diglib}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
