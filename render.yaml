################################################################################
# render.yaml — Digital Library Management – Backend Services
#
# Pattern mirrors friend's Docker-based Blueprint approach:
#   - All services run as Docker containers (env: docker)
#   - PostgreSQL is Render-managed (fromDatabase property injection)
#   - JWT secret is auto-generated and shared across services via fromService
#   - MongoDB stays on external Atlas (MONGO_URI set manually via sync: false)
#   - Frontend is a free static site
################################################################################

services:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. API GATEWAY  (FastAPI / Python)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: digital-library-management-gateway
    runtime: python
    region: singapore          # closest free-tier region to India
    plan: free

    # Path inside your repo that contains requirements.txt and main.py
    rootDir: Backend/gateway

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # ── Upstream service URLs (set after the other two services are deployed) ──
      - key: SPRING_URL
        value: https://digital-library-management-coreservice.onrender.com

      - key: NODE_URL
        value: https://digital-library-management-taskservices.onrender.com

      # ── JWT ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard — never commit secrets!

      - key: JWT_ALGORITHM
        value: HS256

      # ── CORS — add your frontend URL after it is deployed ──────────────────
      - key: FRONTEND_URL
        value: ""

  # ──────────────────────────────────────────────────────────────────────────
  # 2. TASK SERVICES  (Node.js / Express / MongoDB)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: digital-library-management-taskservices
    runtime: node
    region: singapore

services:

  # ── 2. Core Services – Spring Boot (Containerized) ─────────────────────────
  - type: web
    name: digital-library-management-coreservice
    runtime: java
    region: singapore
    envVars:
      # PostgreSQL — injected directly from the managed DB
      - key: DB_HOST
        fromDatabase:
          name: digital-library-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        fromDatabase:
          name: digital-library-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: digital-library-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: digital-library-db
          property: password
      # JWT — auto-generated once, shared to other services
      - key: JWT_SECRET
        generateValue: true
      # JPA DDL — "update" creates tables on first deploy
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # ── 3. Task Services – Node.js / Express / MongoDB (Containerized) ──────────
  - type: web
    name: digital-library-taskservices
    env: docker
    dockerContext: Backend/taskservices
    dockerfilePath: Backend/taskservices/Dockerfile
    plan: free
    region: singapore
    envVars:
      # MongoDB Atlas — paste connection string manually in Render dashboard
      - key: DBURL
        sync: false
      # JWT — pulled from coreservices so all services share the same secret
      - key: SECRETE_KEY
        fromService:
          name: digital-library-coreservices
          type: web
          envVarKey: JWT_SECRET

  # ── 4. API Gateway – FastAPI (Containerized) ────────────────────────────────
  - type: web
    name: digital-library-gateway
    env: docker
    dockerContext: Backend/gateway
    dockerfilePath: Backend/gateway/Dockerfile
    plan: free
    region: singapore
    envVars:
      # Shared JWT secret from coreservices
      - key: JWT_SECRET
        fromService:
          name: digital-library-coreservices
          type: web
          envVarKey: JWT_SECRET
      - key: JWT_ALGORITHM
        value: HS256
      # Internal service URLs — pulled automatically from deployed services
      - key: SPRING_BOOT_URL
        fromService:
          name: digital-library-coreservices
          type: web
          property: host
      - key: NODE_URL
        fromService:
          name: digital-library-taskservices
          type: web
          property: host

  # ── 5. Frontend – React / Vite (Static Site – FREE) ─────────────────────────
  - type: web
    name: digital-library-frontend
    runtime: static
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    plan: free
    region: singapore
    envVars:
      # API base URL — points to the gateway
      - key: VITE_API_URL
        fromService:
          name: digital-library-gateway
          type: web
          property: host
