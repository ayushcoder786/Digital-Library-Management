################################################################################
# railway.toml — Digital Library Management (Task Services – Node.js)
#
# Place this file inside Backend/taskservices/
# Railway will auto-detect Node.js and run npm install
################################################################################

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node main.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
