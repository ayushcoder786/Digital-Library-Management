spring.application.name=coreservices

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects $PORT automatically; fallback to 8081 for local dev
server.port=${PORT:8081}

# ── PostgreSQL DataSource ─────────────────────────────────────────────────────
# On Render: values are injected from environment variables (see render.yaml)
# For local dev: set these in a .env or export them in your shell, OR
#   override in application-local.properties (which remains gitignored)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/diglib}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# "update" on first deploy to auto-create tables; switch to "validate" after
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:DigitalLibrary@SecretKey#2026$SpringBoot&JWT!Secure}
